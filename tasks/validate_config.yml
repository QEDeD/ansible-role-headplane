---
- name: (Deprecation) Catch and report unsupported Headplane agent pre-auth key setting
  ansible.builtin.fail:
    msg: >-
      `headplane_config_integration_agent_pre_authkey` is no longer supported for Headplane 0.7.
      Headplane 0.7's agent uses `headscale.api_key` and creates its own short-lived pre-auth keys.
      Create or provide a Headscale API key and configure it via `headplane_config_headscale_api_key`.
      The old pre-auth key is a different credential type and must not be copied into the new variable.
  when: "lookup('ansible.builtin.varnames', '^headplane_config_integration_agent_pre_authkey$', wantlist=True) | length > 0"

- name: (Deprecation) Catch and report renamed settings
  ansible.builtin.fail:
    msg: >-
      Your configuration contains a variable, which now has a different name.
      Please change your configuration to rename the variable (`{{ item.old }}` -> `{{ item.new }}`).
  when: "lookup('ansible.builtin.varnames', ('^' + item.old + '$'), wantlist=True) | length > 0"
  with_items:
    - { "old": "headplane_container_image_force_pull", "new": "<removed> (the new community.docker.docker_image_pull module handles this natively)" }

- name: Fail if required Headplane settings not defined
  ansible.builtin.fail:
    msg: >-
      You need to define a required configuration setting (`{{ item }}`).
  when: "lookup('vars', item, default='') | string | length == 0"
  with_items:
    - headplane_uid
    - headplane_gid
    - headplane_hostname
    - headplane_cookie_secret
    - headplane_headscale_hostname
    - headplane_headscale_port

- name: Fail if Headplane agent integration is enabled without a Headscale API key
  ansible.builtin.fail:
    msg: >-
      You need to define `headplane_config_headscale_api_key` with a Headscale API key
      when `headplane_config_integration_agent_enabled` is enabled.
  when:
    - headplane_config_integration_agent_enabled | bool
    - headplane_config_headscale_api_key | string | length == 0

- name: Fail if Headplane default-gateway network is not attached
  ansible.builtin.fail:
    msg: >-
      headplane_container_default_gateway_network must be empty,
      equal to headplane_container_network, or name an entry in
      headplane_container_additional_networks.
  when:
    - headplane_container_default_gateway_network | length > 0
    - headplane_container_default_gateway_network not in ([headplane_container_network] + headplane_container_additional_networks)

- name: Check Docker gateway-priority support
  when: headplane_container_default_gateway_network | length > 0
  block:
    - name: Retrieve Docker server API version
      ansible.builtin.command:
        cmd: >-
          {{ devture_systemd_docker_base_host_command_docker }} version
          --format {% raw %}'{{.Server.APIVersion}}'{% endraw %}
      register: headplane_docker_server_api_version_result
      changed_when: false
      failed_when: false

    - name: Check whether Docker network connect supports gateway priority
      ansible.builtin.command:
        cmd: "{{ devture_systemd_docker_base_host_command_docker }} network connect --help"
      register: headplane_docker_network_connect_help_result
      changed_when: false
      failed_when: false

    - name: Fail if Docker does not support gateway priority
      ansible.builtin.fail:
        msg: >-
          headplane_container_default_gateway_network requires Docker Engine 28 or newer
          (server API 1.48 or newer) and a Docker CLI with
          docker network connect --gw-priority support.
      when: >-
        headplane_docker_server_api_version_result.rc != 0
        or headplane_docker_server_api_version_result.stdout | trim | length == 0
        or (headplane_docker_server_api_version_result.stdout | trim) is version('1.48', '<')
        or headplane_docker_network_connect_help_result.rc != 0
        or '--gw-priority' not in headplane_docker_network_connect_help_result.stdout

- name: Fail if Headplane architecture is not supported
  ansible.builtin.fail:
    msg: >-
      Your configuration specifies a CPU architecture (`{{ headplane_arch }}`) which is not currently supported.
      This Headplane role also does not support self-building yet, so it's not possible to make use of it.
  when: "headplane_arch not in ['amd64', 'arm64']"

- name: Validate Headplane Traefik configuration
  when: headplane_container_labels_traefik_enabled | bool
  block:
    - name: Fail if Traefik settings required for Headplane are not defined
      ansible.builtin.fail:
        msg: >-
          You need to define a required configuration setting (`{{ item }}`).
      when: "lookup('vars', item, default='') | string | length == 0"
      with_items:
        - headplane_container_labels_traefik_hostname
        - headplane_container_labels_traefik_path_prefix

    # We ensure it doesn't end with a slash, because we handle both (slash and no-slash).
    # Knowing that `headplane_container_labels_traefik_path_prefix` does not end with a slash
    # ensures we know how to set these routes up without having to do "does it end with a slash" checks elsewhere.
    - name: Fail if headplane_container_labels_traefik_path_prefix ends with a slash
      ansible.builtin.fail:
        msg: >-
          headplane_container_labels_traefik_path_prefix (`{{ headplane_container_labels_traefik_path_prefix }}`) must either be `/` or not end with a slash (e.g. `/headplane`).
      when: "headplane_container_labels_traefik_path_prefix != '/' and headplane_container_labels_traefik_path_prefix[-1] == '/'"
