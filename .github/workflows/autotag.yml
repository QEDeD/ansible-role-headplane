---
name: Autotag releases

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write  # required to push tags

jobs:
  autotag:
    name: Autotag
    runs-on: ubuntu-latest

    # Releases are cut only from main in the repository this role is published
    # from. A fork has its own incomplete tag namespace, while another branch
    # may contain code that has not been accepted for release.
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}

    # Tag numbers are derived from existing tags, so runs must not compute them
    # simultaneously. Keep pending runs for evaluation, while the tag script
    # safely skips an older commit that a later release already includes.
    concurrency:
      group: autotag
      cancel-in-progress: false
      queue: max

    steps:
      # The full history and all tags, since we compare against the previous release.
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the next tag
        id: tag
        run: |
          tag="$(bin/compute-next-tag.sh)"
          if [ -z "$tag" ]; then
            echo 'No release is needed for this commit'
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
