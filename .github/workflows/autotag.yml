---
name: Create role release tag

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full commit SHA on main to tag
        required: true
        type: string
      role_revision:
        description: Role release revision (0, 1, ...)
        required: true
        default: "0"
        type: string

permissions:
  contents: write  # required to push tags

concurrency:
  group: headplane-role-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Create role release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release target and tag
        env:
          ROLE_REVISION: ${{ inputs.role_revision }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be a full lowercase commit SHA"
            exit 1
          fi

          if [[ ! "$ROLE_REVISION" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::role_revision must be a non-negative integer"
            exit 1
          fi

          if ! target_commit="$(git rev-parse --verify "${TARGET_SHA}^{commit}")"; then
            echo "::error::target_sha does not identify a commit"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$target_commit" "$GITHUB_SHA"; then
            echo "::error::target_sha is not contained in main"
            exit 1
          fi

          mapfile -t versions < <(
            git show "${target_commit}:defaults/main.yml" \
              | sed -nE 's/^headplane_version:[[:space:]]*([^[:space:]#]+)([[:space:]]*#.*)?$/\1/p'
          )

          if [[ "${#versions[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one headplane_version in defaults/main.yml"
            exit 1
          fi

          version="${versions[0]}"

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::headplane_version is not a supported version"
            exit 1
          fi

          tag="v${version}-${ROLE_REVISION}"
          if ! git check-ref-format "refs/tags/${tag}"; then
            echo "::error::The resulting tag name is invalid: ${tag}"
            exit 1
          fi

          git fetch --tags origin

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            existing_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [[ "$existing_commit" == "$target_commit" ]]; then
              echo "Tag ${tag} already points to ${target_commit}."
              exit 0
            fi

            echo "::error::Tag ${tag} points to ${existing_commit}, not ${target_commit}"
            exit 1
          fi

          echo "Tagging ${target_commit} with ${tag}"
          git tag "${tag}" "${target_commit}"
          git push origin "refs/tags/${tag}:refs/tags/${tag}"
