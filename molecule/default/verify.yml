---
- name: Verify Headplane systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read Headplane environment file
      ansible.builtin.slurp:
        src: /headplane/env
      register: headplane_environment_file

    - name: Assert Headscale API key is rendered into the Headplane environment file
      ansible.builtin.assert:
        that:
          - "'HEADPLANE_HEADSCALE__API_KEY=molecule-headscale-api-key' in (headplane_environment_file.content | b64decode)"

    - name: Read Headplane configuration file
      ansible.builtin.slurp:
        src: /headplane/config.yaml
      register: headplane_configuration_file

    - name: Assert obsolete Headplane agent pre-auth key is not rendered
      ansible.builtin.assert:
        that:
          - "'pre_authkey' not in (headplane_configuration_file.content | b64decode)"

    - name: Wait for Headplane service to become active (up to 180s)
      ansible.builtin.systemd:
        name: headplane.service
      register: headplane_service
      until: headplane_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Headplane service is active
      ansible.builtin.assert:
        that: headplane_service.status.ActiveState == 'active'
        fail_msg: "headplane.service not active ({{ headplane_service.status.ActiveState }})"
        success_msg: "headplane.service is active"

    - name: Retrieve Headplane container information
      community.docker.docker_container_info:
        name: headplane
      register: headplane_container_info

    - name: Assert Headplane container filesystem configuration
      ansible.builtin.assert:
        that:
          - headplane_container_info.container.HostConfig.ReadonlyRootfs
          - headplane_container_info.container.HostConfig.Tmpfs["/tmp"] == "rw,noexec,nosuid"
          - headplane_container_info.container.HostConfig.CapDrop == ["ALL"]

    - name: Assert Headplane container network configuration
      ansible.builtin.assert:
        that:
          - "'headplane' in headplane_container_info.container.NetworkSettings.Networks"
          - "'headplane-control' in headplane_container_info.container.NetworkSettings.Networks"
          - headplane_container_info.container.NetworkSettings.Networks['headplane'].GwPriority == 0
          - headplane_container_info.container.NetworkSettings.Networks['headplane-control'].GwPriority == 1
          - >-
            headplane_container_info.container.NetworkSettings.Networks
            | dict2items
            | selectattr('value.GwPriority', 'equalto', 1)
            | list
            | length == 1

    - name: Retrieve Headplane service log for debugging
      when: headplane_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu headplane.service
      changed_when: false

    - name: Wait for Headplane HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:3000/admin"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: headplane_endpoint
      until: headplane_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert Headplane HTTP endpoint responds
      ansible.builtin.assert:
        that: headplane_endpoint.status in [200, 302]
        fail_msg: "Headplane did not respond as expected ({{ headplane_endpoint.status | default('no response') }})"
        success_msg: "Headplane responded with {{ headplane_endpoint.status }}"

    - name: Show Headplane systemd service status summary
      ansible.builtin.debug:
        msg:
          - "Headplane systemd: {{ headplane_service.status.ActiveState }}"
          - "Headplane HTTP: {{ headplane_endpoint.status }}"
